name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "shared/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "shared/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Lint & Test FastAPI & Celery
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd backend
          uv pip install --system -e ".[dev]"

      - name: Run Flake8 Linter
        run: |
          cd backend
          flake8 .

      - name: Run Mypy Type Checker
        run: |
          cd backend
          mypy app worker

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest -v
