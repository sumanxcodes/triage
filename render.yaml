services:
  # 1. FastAPI Threat Intelligence Web Service
  - type: web
    name: triage-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: triage-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: triage-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: triage-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: triage-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: URLHAUS_AUTH_KEY
        sync: false

  # 2. Redis Key-Value Store & Cache
  - type: redis
    name: triage-redis
    plan: free
    ipAllowList: []

databases:
  # 3. Managed PostgreSQL Database
  - name: triage-postgres
    databaseName: triage_db
    user: triage
    plan: free
