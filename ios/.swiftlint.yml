# SwiftLint Configuration for Triage iOS Codebase

included:
  - TriageApp
  - TriageMessageFilter
  - TriageSafariExtension
  - TriageShared

excluded:
  - .build
  - DerivedData
  - SourcePackages
  - fastlane
  - Triage.xcodeproj
  - Triage.xcworkspace

disabled_rules:
  - line_length
  - trailing_whitespace
  - type_body_length
  - file_length

opt_in_rules:
  - empty_count
  - force_unwrapping
  - closure_spacing
  - redundant_nil_coalescing

force_cast: warning
force_try: warning

reporter: "xcode"
